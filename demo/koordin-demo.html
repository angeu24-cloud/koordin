<title>KOORDIN Démo</title>
<meta name="description" content="Démonstration interactive de KOORDIN, la plateforme de pilotage de chantiers BTP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<style>
/* KOORDIN — feuille de style
   Thème sombre par défaut (charte KOORDIN), thème clair pour le terrain en plein soleil. */

:root {
  color-scheme: dark;
  --bg: #0a0d16;
  --surface: #111521;
  --surface-2: #161b2a;
  --surface-3: #1c2235;
  --border: #232b40;
  --border-2: #2c3652;
  --text: #eef0f8;
  --text-2: #a3abc2;
  --text-3: #6d7590;
  --gold: #e8a020;
  --gold-2: #f5bf50;
  --gold-ink: #1a1203;
  --gold-dim: rgba(232, 160, 32, .12);
  --ai: #9085e9;
  --ai-dim: rgba(144, 133, 233, .14);
  --ok: #2ecc8a;
  --ok-dim: rgba(46, 204, 138, .13);
  --warn: #f0b429;
  --warn-dim: rgba(240, 180, 41, .14);
  --crit: #ff6b6b;
  --crit-dim: rgba(255, 107, 107, .14);
  --info: #5aa7ff;
  --info-dim: rgba(90, 167, 255, .14);
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-ref: #5b6480;
  --grid: #232b40;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --radius: 12px;
  --font: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-2: #f7f8fb;
    --surface-3: #eef0f5;
    --border: #e1e4ec;
    --border-2: #cfd4e0;
    --text: #141826;
    --text-2: #4d556b;
    --text-3: #7c8399;
    --gold: #b97700;
    --gold-2: #d99a1c;
    --gold-ink: #ffffff;
    --gold-dim: rgba(185, 119, 0, .1);
    --ai: #6250d6;
    --ai-dim: rgba(98, 80, 214, .1);
    --ok: #0f8a5c;
    --ok-dim: rgba(15, 138, 92, .1);
    --warn: #a86b00;
    --warn-dim: rgba(168, 107, 0, .1);
    --crit: #c92a2a;
    --crit-dim: rgba(201, 42, 42, .09);
    --info: #1c64c4;
    --info-dim: rgba(28, 100, 196, .09);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-ref: #b3b9c8;
    --grid: #e6e8ef;
    --shadow: 0 10px 30px rgba(20, 24, 38, .12);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --surface-3: #eef0f5;
  --border: #e1e4ec;
  --border-2: #cfd4e0;
  --text: #141826;
  --text-2: #4d556b;
  --text-3: #7c8399;
  --gold: #b97700;
  --gold-2: #d99a1c;
  --gold-ink: #ffffff;
  --gold-dim: rgba(185, 119, 0, .1);
  --ai: #6250d6;
  --ai-dim: rgba(98, 80, 214, .1);
  --ok: #0f8a5c;
  --ok-dim: rgba(15, 138, 92, .1);
  --warn: #a86b00;
  --warn-dim: rgba(168, 107, 0, .1);
  --crit: #c92a2a;
  --crit-dim: rgba(201, 42, 42, .09);
  --info: #1c64c4;
  --info-dim: rgba(28, 100, 196, .09);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-ref: #b3b9c8;
  --grid: #e6e8ef;
  --shadow: 0 10px 30px rgba(20, 24, 38, .12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
.hidden { display: none !important; }

/* ── Marque ── */
.brand { display: flex; align-items: center; gap: 10px; }
.hex {
  width: 28px; height: 28px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: .5px; color: var(--gold); }

/* ── Boutons et champs ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 9px; border: 1px solid var(--border-2);
  background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 13px;
  cursor: pointer; transition: border-color .15s, background .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--text-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--gold-ink); border-color: transparent; }
.btn.danger { color: var(--crit); border-color: var(--crit-dim); background: var(--crit-dim); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
.btn.block { width: 100%; }

label.field, div.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.field input, .field select, .field textarea, input.input, select.input {
  width: 100%; padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text);
  font-size: 14px; font-weight: 400; outline: none;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { border-color: var(--gold); }
.field .hint { font-weight: 400; color: var(--text-3); font-size: 11px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
input[type="range"] { accent-color: var(--gold); padding: 0 !important; }

/* ── Écran de connexion ── */
.auth-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.auth-card {
  width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 28px; box-shadow: var(--shadow);
}
.auth-card .brand { margin-bottom: 6px; }
.auth-sub { color: var(--text-2); font-size: 13px; margin-bottom: 22px; }
.auth-tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.auth-tabs button {
  flex: 1; padding: 8px 6px; border: 0; background: transparent; border-radius: 7px;
  font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer;
}
.auth-tabs button.active { background: var(--surface-3); color: var(--text); }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.auth-msg { font-size: 13px; padding: 10px 12px; border-radius: 9px; }
.auth-msg.err { background: var(--crit-dim); color: var(--crit); }
.auth-msg.ok { background: var(--ok-dim); color: var(--ok); }
.auth-link { background: none; border: 0; color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: underline; }

/* ── Structure de l'application ── */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 58px 1fr; height: 100vh; height: 100dvh; }
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 18px;
  background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 20;
}
.topbar .company { color: var(--text-2); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sep { width: 1px; height: 22px; background: var(--border); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  position: relative; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface-2); display: grid; place-items: center; cursor: pointer; font-size: 16px;
}
.icon-btn .count {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--crit); color: #fff; font-size: 10px; font-weight: 700;
  display: grid; place-items: center;
}
.user-chip {
  display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 4px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; max-width: 230px;
}
.avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--gold-ink); font-weight: 800; font-size: 12px;
}
.user-chip .who { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.user-chip .who b { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip .who span { font-size: 11px; color: var(--text-3); }

.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 14px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px; margin-bottom: 2px;
  color: var(--text-2); font-weight: 500; font-size: 13px; cursor: pointer; border: 1px solid transparent;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--gold-dim); color: var(--gold); border-color: var(--gold-dim); font-weight: 600; }
.nav-item .lbl-court { display: none; }
.nav-item .ico { width: 20px; text-align: center; font-size: 15px; }
.nav-item .badge-n { margin-left: auto; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 9px; background: var(--crit); color: #fff; }

.main { overflow-y: auto; padding: 24px; }
.page { max-width: 1240px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.page-sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back { color: var(--text-2); font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; margin-bottom: 8px; }

/* ── Cartes, KPI ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.card + .card { margin-top: 16px; }
.grid > .card + .card { margin-top: 0; }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-title small { font-weight: 500; color: var(--text-3); font-size: 12px; }
.grid { display: grid; gap: 16px; }
.grid.k4 { grid-template-columns: repeat(4, 1fr); }
.grid.k3 { grid-template-columns: repeat(3, 1fr); }
.grid.c2 { grid-template-columns: 1fr 1fr; }
.grid.c21 { grid-template-columns: 2fr 1fr; }
.section { margin-top: 16px; }

.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.kpi-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi-foot { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.kpi.alert .kpi-value { color: var(--crit); }
.kpi.warn .kpi-value { color: var(--warn); }

/* ── Badges d'état (toujours icône + texte) ── */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok-dim); color: var(--ok); }
.badge.warn { background: var(--warn-dim); color: var(--warn); }
.badge.crit { background: var(--crit-dim); color: var(--crit); }
.badge.info { background: var(--info-dim); color: var(--info); }
.badge.muted { background: var(--surface-3); color: var(--text-2); }
.badge.ai { background: var(--ai-dim); color: var(--ai); }

/* ── Barres de progression ── */
.progress { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; position: relative; }
.progress > span { display: block; height: 100%; border-radius: 4px; background: var(--series-1); }
.progress.ok > span { background: var(--ok); }
.progress.warn > span { background: var(--warn); }
.progress.crit > span { background: var(--crit); }
.progress .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .6; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-row .progress { flex: 1; }
.progress-row .pct { font-size: 12px; font-weight: 700; width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

/* ── Tableaux ── */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px;
  padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
}
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .muted { color: var(--text-3); }
.tbl tr.over td { background: var(--crit-dim); }
.empty { text-align: center; color: var(--text-3); padding: 36px 16px; font-size: 13px; }
.empty .big { font-size: 30px; margin-bottom: 6px; }

/* ── Filtres et onglets ── */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.toolbar .input { width: auto; min-width: 170px; padding: 8px 10px; font-size: 13px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab {
  padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; background: none; border-top: 0; border-left: 0; border-right: 0;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }

/* ── Cartes projet ── */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.project-card { cursor: pointer; transition: border-color .15s, transform .15s; display: flex; flex-direction: column; gap: 12px; }
.project-card:hover { border-color: var(--border-2); transform: translateY(-1px); }
.project-card .pc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.project-card h3 { font-size: 15px; font-weight: 700; }
.project-card .meta { font-size: 12px; color: var(--text-3); }
.pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pc-stats div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.pc-stats b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.pc-stats span { font-size: 11px; color: var(--text-3); }

/* ── Flux d'activité ── */
.feed { display: flex; flex-direction: column; }
.feed-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.feed-item:last-child { border-bottom: 0; }
.feed-dot { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; font-size: 13px; background: var(--surface-3); }
.feed-dot.critique { background: var(--crit-dim); }
.feed-dot.attention { background: var(--warn-dim); }
.feed-item .when { font-size: 11px; color: var(--text-3); }

/* ── Rapports ── */
.report { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; }
.report + .report { margin-top: 12px; }
.report .r-body { flex: 1; min-width: 0; }
.report .r-title { font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.report .r-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.report .r-text { font-size: 13px; color: var(--text-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.photos img, .photos .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-3); }
.photo-pick { position: relative; }
.photo-pick button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 6px; border: 0; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; }
.detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.detail-grid div { background: var(--surface-2); border-radius: 8px; padding: 10px; }
.detail-grid span { font-size: 11px; color: var(--text-3); display: block; }
.detail-grid b { font-size: 14px; }
.detail-block { margin-bottom: 14px; }
.detail-block h4 { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
.detail-block p { white-space: pre-wrap; }

/* ── Planning (Gantt) ── */
.gantt { overflow-x: auto; }
.gantt-inner { min-width: 720px; }
.g-head, .g-row { display: grid; grid-template-columns: 220px 1fr; }
.g-head .g-scale { position: relative; height: 28px; border-bottom: 1px solid var(--border); }
.g-month { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--border); font-size: 11px; color: var(--text-3); padding: 5px 6px; white-space: nowrap; overflow: hidden; }
.g-row { border-bottom: 1px solid var(--border); }
.g-row:hover { background: var(--surface-2); }
.g-label { padding: 9px 10px 9px 0; font-size: 13px; overflow: hidden; }
.g-label b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-label span { font-size: 11px; color: var(--text-3); }
.g-track { position: relative; min-height: 46px; }
.g-bar { position: absolute; top: 13px; height: 20px; border-radius: 4px; background: var(--surface-3); border: 1px solid var(--border-2); overflow: hidden; cursor: pointer; min-width: 4px; }
.g-bar > span { position: absolute; inset: 0 auto 0 0; background: var(--series-1); opacity: .9; }
.g-bar.late > span { background: var(--crit); }
.g-bar.behind > span { background: var(--warn); }
.g-bar.done > span { background: var(--ok); }
.g-bar em { position: relative; font-style: normal; font-size: 10px; font-weight: 700; padding: 0 6px; line-height: 18px; color: var(--text); text-shadow: 0 0 3px var(--surface); }
.g-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--text); opacity: .55; z-index: 2; }
.g-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 12px; }
.g-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

/* ── Graphiques ── */
.chart-box { position: relative; height: 300px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ── Assistant IA ── */
.chat { display: flex; flex-direction: column; height: calc(100dvh - 58px - 48px - 76px); min-height: 420px; }
.chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 12px; }
.msg { max-width: 760px; padding: 12px 15px; border-radius: 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
.msg.ia { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-top-left-radius: 4px; }
.msg.moi { background: var(--ai-dim); border: 1px solid var(--ai-dim); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.err { background: var(--crit-dim); color: var(--crit); align-self: flex-start; }
.chat-suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chat-input { display: flex; gap: 8px; align-items: flex-end; }
.chat-input textarea { flex: 1; min-height: 46px; max-height: 140px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--surface); resize: none; outline: none; }
.chat-input textarea:focus { border-color: var(--ai); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); animation: blink 1.2s infinite; }

  function charger() {
    try { DB = JSON.parse(lire(CLE) || 'null'); } catch { DB = null; }
    if (!DB || !DB.profils) { DB = graine(); sauver(); }
    try { PHOTOS = JSON.parse(lire(CLE_PHOTOS) || '{}'); } catch { PHOTOS = {}; }
  }
  function sauver() { ecrire(CLE, JSON.stringify(DB)); }
  function sauverPhotos() { ecrire(CLE_PHOTOS, JSON.stringify(PHOTOS)); }

  // ───────────────────────── Habilitations (miroir du schéma SQL) ─────────────────────────

  const profil = () => DB.profils.find((p) => p.id === moi && p.actif);
  const role = () => profil()?.role;
  const a = (...roles) => roles.includes(role());
  const ent = () => profil()?.entreprise_id;
  const voitProjet = (pid) => {
    const pr = DB.projets.find((p) => p.id === pid);
    if (!pr || !profil()) return false;
    return role() !== 'technicien' || DB.affectations.some((x) => x.projet_id === pid && x.profil_id === moi);
  };
  const LECTURE = {
    entreprises: (r) => r.id === ent(),
    profils: () => !!profil(),
    invitations: () => a('direction'),
    projets: (r) => voitProjet(r.id),
    affectations: () => !!profil(),
    lots: (r) => voitProjet(r.projet_id),
    taches: (r) => voitProjet(r.projet_id),
    rapports: (r) => !!profil() && (a('direction', 'coordinateur') || r.auteur_id === moi),
    rapport_photos: (r) => { const rp = DB.rapports.find((x) => x.id === r.rapport_id); return !!rp && LECTURE.rapports(rp); },
    fournisseurs: () => !!profil() && !a('technicien'),
    commandes: () => a('direction', 'coordinateur', 'achats', 'comptable', 'magasinier'),
    factures: () => a('direction', 'coordinateur', 'achats', 'comptable'),
    articles: () => !!profil(),
    mouvements_stock: () => !!profil(),
    activites: (r) => !!profil() && (!r.roles || r.roles.includes(role())) && (!r.projet_id || voitProjet(r.projet_id)),
  };
  const GERE = ['direction', 'coordinateur'];
  function peut(table, op, ligne, avant) {
    if (!profil()) return false;
    switch (table) {
      case 'entreprises': return op === 'update' && a('direction');
      case 'profils': return op === 'update' && a('direction');
      case 'invitations': return a('direction');
      case 'projets': return op === 'delete' ? a('direction') : a(...GERE);
      case 'affectations': return a(...GERE);
      case 'lots': case 'taches': return a(...GERE) && voitProjet(ligne.projet_id);
      case 'rapports':
        if (op === 'insert') return ligne.auteur_id === moi && ligne.statut === 'soumis' && a('technicien', ...GERE) && voitProjet(ligne.projet_id);
        if (op === 'update') return a(...GERE) || (avant.auteur_id === moi && avant.statut === 'soumis' && ligne.statut === 'soumis');
        return a('direction');
      case 'rapport_photos': { const rp = DB.rapports.find((x) => x.id === ligne.rapport_id); return !!rp && (rp.auteur_id === moi || a(...GERE)); }
      case 'fournisseurs': return a('direction', 'achats', 'comptable');
      case 'commandes': return a('direction', 'achats') && voitProjet(ligne.projet_id);
      case 'factures': return a('direction', 'comptable') && voitProjet(ligne.projet_id);
      case 'articles': return a('direction', 'magasinier', 'achats');
      case 'mouvements_stock': return op === 'insert' ? a('direction', 'magasinier') : op === 'delete' && a('direction');
      default: return false;
    }
  }
  const erreurDroits = () => ({ message: 'new row violates row-level security policy', code: '42501' });

  // ───────────────────────── Automatismes (miroir des déclencheurs) ─────────────────────────

  const nomDe = (id) => DB.profils.find((p) => p.id === id)?.nom || 'Quelqu’un';
  const nomProjet = (id) => DB.projets.find((p) => p.id === id)?.nom || '';
  const ROLES_FIN = ['direction', 'coordinateur', 'achats', 'comptable'];
  const somme = (l, f = (x) => x.montant) => l.reduce((s, x) => s + Number(f(x) || 0), 0);
  const fmt = (n) => String(Math.round(Number(n) * 100) / 100);

  function activite(projet_id, type, niveau, message, roles = null) {
    const r = { id: nouvelId(), entreprise_id: ent(), projet_id, type, niveau, message, roles, acteur_id: moi, created_at: new Date().toISOString() };
    DB.activites.push(r);
    setTimeout(() => ecouteurs.filter((e) => e.table === 'activites').forEach((e) => { if (LECTURE.activites(r)) e.cb({ new: { ...r } }); }), 0);
  }

  function controlerBudget(pid, lid) {
    const pr = DB.projets.find((p) => p.id === pid);
    if (!pr) return;
    const dep = Math.max(somme(DB.commandes.filter((c) => c.projet_id === pid && c.statut !== 'annulee')), somme(DB.factures.filter((f) => f.projet_id === pid)));
    if (pr.budget > 0 && dep > pr.budget) activite(pid, 'alerte', 'critique', `Budget dépassé sur « ${pr.nom} » : ${Math.round((dep / pr.budget) * 100)} % du budget consommé`, ROLES_FIN);
    else if (pr.budget > 0 && dep > pr.budget * 0.9) activite(pid, 'alerte', 'attention', `Budget presque épuisé sur « ${pr.nom} » : ${Math.round((dep / pr.budget) * 100)} % consommé`, ROLES_FIN);
    const lt = lid && DB.lots.find((l) => l.id === lid);
    if (lt) {
      const depL = Math.max(somme(DB.commandes.filter((c) => c.lot_id === lid && c.statut !== 'annulee')), somme(DB.factures.filter((f) => f.lot_id === lid)));
      if (lt.budget > 0 && depL > lt.budget) activite(pid, 'alerte', 'critique', `Lot « ${lt.nom} » (${pr.nom}) hors budget : ${Math.round((depL / lt.budget) * 100)} %`, ROLES_FIN);
    }
  }

  function quantiteStock(article_id) {
    return DB.mouvements_stock.filter((m) => m.article_id === article_id).reduce((s, m) => s + (m.type === 'entree' ? 1 : -1) * Number(m.quantite), 0);
  }

  const AVANT_INSERTION = {
    mouvements_stock(r) {
      const art = DB.articles.find((x) => x.id === r.article_id);
      const qte = quantiteStock(r.article_id);
      if (r.type === 'sortie' && Number(r.quantite) > qte) throw { message: `Stock insuffisant pour « ${art.nom} » : ${fmt(qte)} ${art.unite} disponibles`, code: 'P0001' };
    },
    factures(r) {
      if (r.numero && r.fournisseur_id && DB.factures.some((f) => f.fournisseur_id === r.fournisseur_id && f.numero === r.numero && f.id !== r.id)) {
        throw { message: 'duplicate key value violates unique constraint "factures_numero_unique"', code: '23505' };
      }
    },
  };
  const APRES_INSERTION = {
    projets(r) { activite(r.id, 'projet', 'info', `${nomDe(moi)} a créé le projet « ${r.nom} »`); },
    rapports(r) {
      const inc = (r.incidents || '').trim();
      activite(r.projet_id, 'rapport', inc ? 'attention' : 'info', `${nomDe(r.auteur_id)} a envoyé un rapport sur « ${nomProjet(r.projet_id)} »${inc ? ' — incident signalé' : ''}`, GERE);
    },
    commandes(r) {
      activite(r.projet_id, 'commande', 'info', `${nomDe(moi)} a enregistré la commande « ${r.designation} » (${nomProjet(r.projet_id)})`, ['direction', 'coordinateur', 'achats', 'comptable', 'magasinier']);
      controlerBudget(r.projet_id, r.lot_id);
    },
    factures(r) {
      activite(r.projet_id, 'facture', 'info', `${nomDe(moi)} a saisi « ${r.libelle} » (${nomProjet(r.projet_id)})`, ROLES_FIN);
      if (r.fournisseur_id) {
        const d = DB.factures.find((f) => f.id !== r.id && f.fournisseur_id === r.fournisseur_id && Number(f.montant) === Number(r.montant)
          && Math.abs(new Date(f.date_facture) - new Date(r.date_facture)) <= 60 * JOUR);
        if (d) activite(r.projet_id, 'alerte', 'critique', `Double facturation possible : même fournisseur, même montant que la facture ${d.numero || d.libelle} du ${new Date(d.date_facture).toLocaleDateString('fr-FR')}`, ['direction', 'comptable']);
      }
      controlerBudget(r.projet_id, r.lot_id);
    },
    mouvements_stock(r) {
      if (r.type !== 'sortie') return;
      const art = DB.articles.find((x) => x.id === r.article_id);
      const qte = quantiteStock(r.article_id);
      const roles = ['direction', 'coordinateur', 'magasinier', 'achats'];
      activite(r.projet_id, 'stock', 'info', `Sortie de ${fmt(r.quantite)} ${art.unite} de « ${art.nom} »${r.projet_id ? ` vers ${nomProjet(r.projet_id)}` : ''}`, roles);
      if (qte < Number(art.seuil_min)) activite(null, 'alerte', 'attention', `Stock bas : « ${art.nom} » à ${fmt(qte)} ${art.unite} (seuil ${fmt(art.seuil_min)})`, roles);
    },
  };
  const AVANT_MAJ = {
    rapports(n, o) {
      if (n.statut !== o.statut && ['valide', 'rejete'].includes(n.statut)) {
        n.valide_par = moi;
        n.valide_at = new Date().toISOString();
      }
    },
    projets(n) { n.updated_at = new Date().toISOString(); },
  };
  const APRES_MAJ = {
    rapports(n, o) {
      if (n.statut === o.statut || !['valide', 'rejete'].includes(n.statut)) return;
      if (n.statut === 'valide' && n.lot_id && n.avancement != null) {
        const lt = DB.lots.find((l) => l.id === n.lot_id);
        if (lt) lt.avancement = n.avancement;
      }
      activite(n.projet_id, 'validation', 'info', `${nomDe(moi)} ${n.statut === 'valide' ? 'a validé' : 'a rejeté'} le rapport de ${nomDe(n.auteur_id)} (${nomProjet(n.projet_id)})`, GERE);
    },
    commandes(n, o) {
      if (n.statut === 'livree' && o.statut !== 'livree') activite(n.projet_id, 'commande', 'info', `Commande « ${n.designation} » réceptionnée (${nomProjet(n.projet_id)})`, ['direction', 'coordinateur', 'achats', 'comptable', 'magasinier']);
      controlerBudget(n.projet_id, n.lot_id);
    },
    factures(n) { controlerBudget(n.projet_id, n.lot_id); },
  };

  const DEFAUTS = {
    projets: () => ({ statut: 'en_cours', budget: 0, description: null, reference: null, client: null, localisation: null, date_fin_reelle: null, created_by: moi, updated_at: new Date().toISOString() }),
    lots: () => ({ budget: 0, avancement: 0, ordre: 0 }),
    taches: () => ({ avancement: 0, lot_id: null, responsable_id: null }),
    rapports: () => ({ auteur_id: moi, date_rapport: jour(), statut: 'soumis', lot_id: null, commentaire_validation: null, valide_par: null, valide_at: null }),
    commandes: () => ({ statut: 'commandee', date_commande: jour(), created_by: moi }),
    factures: () => ({ categorie: 'materiaux', statut: 'a_payer', date_facture: jour(), created_by: moi, commande_id: null, date_paiement: null }),
    articles: () => ({ unite: 'u', seuil_min: 0, prix_unitaire: 0 }),
    mouvements_stock: () => ({ created_by: moi, projet_id: null }),
    invitations: () => ({ acceptee_at: null, created_by: moi }),
  };
  const SANS_ID = ['affectations'];

  // ───────────────────────── Vues calculées ─────────────────────────

  function vProjets() {
    const auj = new Date(`${jour()}T00:00:00`);
    const jours = (a, b) => Math.round((b - a) / JOUR);
    const commandes = LECTURE.commandes() ? DB.commandes : [];
    const factures = LECTURE.factures() ? DB.factures : [];
    return DB.projets.filter(LECTURE.projets).map((p) => {
      const lots = DB.lots.filter((l) => l.projet_id === p.id);
      const tb = somme(lots, (l) => l.budget);
      const avancement = lots.length ? Math.round(tb > 0 ? somme(lots, (l) => l.avancement * l.budget) / tb : somme(lots, (l) => l.avancement) / lots.length) : 0;
      const d0 = p.date_debut && new Date(`${p.date_debut}T00:00:00`);
      const d1 = p.date_fin_prevue && new Date(`${p.date_fin_prevue}T00:00:00`);
      let attendu = null;
      if (d0 && d1 && d1 > d0) attendu = auj <= d0 ? 0 : auj >= d1 ? 100 : Math.round((jours(d0, auj) / jours(d0, d1)) * 100);
      const engage = somme(commandes.filter((c) => c.projet_id === p.id && c.statut !== 'annulee'));
      const facture = somme(factures.filter((f) => f.projet_id === p.id));
      const paye = somme(factures.filter((f) => f.projet_id === p.id && f.statut === 'payee'));
      const rapports = DB.rapports.filter((r) => r.projet_id === p.id && LECTURE.rapports(r));
      const retard = p.statut !== 'termine' && d1 && d1 < auj ? jours(d1, auj) : 0;
      const dep = Math.max(engage, facture);
      let sante = 'ok';
      if (p.statut === 'termine') sante = 'termine';
      else if ((p.budget > 0 && dep > p.budget) || (attendu != null && attendu - avancement > 15) || retard > 0) sante = 'critique';
      else if ((p.budget > 0 && dep > p.budget * 0.9) || (attendu != null && attendu - avancement > 5)) sante = 'attention';
      return {
        ...p, avancement, avancement_attendu: attendu, engage, facture, paye,
        rapports_en_attente: rapports.filter((r) => r.statut === 'soumis').length,
        dernier_rapport: rapports.map((r) => r.date_rapport).sort().pop() || null,
        equipe: DB.affectations.filter((x) => x.projet_id === p.id).length,
        jours_de_retard: retard, sante,
      };
    });
  }
  function vBudgetLots() {
    const commandes = LECTURE.commandes() ? DB.commandes : [];
    const factures = LECTURE.factures() ? DB.factures : [];
    return DB.lots.filter(LECTURE.lots).map((l) => ({
      ...l,
      engage: somme(commandes.filter((c) => c.lot_id === l.id && c.statut !== 'annulee')),
      facture: somme(factures.filter((f) => f.lot_id === l.id)),
      paye: somme(factures.filter((f) => f.lot_id === l.id && f.statut === 'payee')),
    }));
  }
  function vStock() {
    return DB.articles.filter(LECTURE.articles).map((x) => {
      const quantite = quantiteStock(x.id);
      return { ...x, quantite, alerte: quantite < Number(x.seuil_min) };
    });
  }
  const VUES = { v_projets: vProjets, v_budget_lots: vBudgetLots, v_stock: vStock };

  // ───────────────────────── Requêtes (sous-ensemble de supabase-js) ─────────────────────────

  function decouper(s) {
    const parts = [];
    let prof = 0, cur = '';
    for (const c of s) {
      if (c === '(') prof++;
      if (c === ')') prof--;
      if (c === ',' && prof === 0) { parts.push(cur); cur = ''; } else cur += c;
    }
    if (cur.trim()) parts.push(cur);
    return parts.map((x) => x.trim()).filter(Boolean);
  }
  function analyserSelect(s) {
    return decouper(s || '*').map((t) => {
      const m = t.match(/^(?:(\w+):)?(\w+)(?:!(\w+))?\(([\s\S]*)\)$/);
      if (m) return { alias: m[1] || m[2], table: m[2], indice: m[3], cols: analyserSelect(m[4]) };
      return { col: t };
    });
  }
  const CLES = { projets: 'projet_id', lots: 'lot_id', fournisseurs: 'fournisseur_id', articles: 'article_id', entreprises: 'entreprise_id', commandes: 'commande_id' };
  function relation(base, table, indice) {
    if (indice) return { type: 'un', cle: indice.replace(`${base}_`, '').replace(/_fkey$/, '') };
    if (table === 'profils') return { type: 'un', cle: { taches: 'responsable_id', affectations: 'profil_id', rapports: 'auteur_id' }[base] };
    if (table === 'rapport_photos') return { type: 'plusieurs', cle: 'rapport_id' };
    return { type: 'un', cle: CLES[table] };
  }
  function projeter(base, ligne, sel) {
    const out = {};
    for (const s of sel) {
      if (s.col === '*') Object.assign(out, ligne);
      else if (s.col) out[s.col] = ligne[s.col];
      else {
        const rel = relation(base, s.table, s.indice);
        const lect = LECTURE[s.table] || (() => true);
        if (rel.type === 'un') {
          const cible = DB[s.table].find((x) => x.id === ligne[rel.cle]);
          out[s.alias] = cible && lect(cible) ? projeter(s.table, cible, s.cols) : null;
        } else {
          out[s.alias] = DB[s.table].filter((x) => x[rel.cle] === ligne.id && lect(x)).map((x) => projeter(s.table, x, s.cols));
        }
      }
    }
    return out;
  }
  const copie = (o) => JSON.parse(JSON.stringify(o));

  class Requete {
    constructor(table) {
      this.table = table; this.op = 'select'; this.filtres = []; this.ordres = []; this.max = null;
      this.sel = '*'; this.retour = false; this.un = false; this.peutEtreVide = false; this.compte = false; this.tete = false;
    }
    select(cols = '*', opts = {}) { this.sel = cols; this.retour = true; if (opts.count) this.compte = true; if (opts.head) this.tete = true; return this; }
    insert(lignes) { this.op = 'insert'; this.valeurs = Array.isArray(lignes) ? lignes : [lignes]; return this; }
    update(v) { this.op = 'update'; this.valeurs = v; return this; }
    delete() { this.op = 'delete'; return this; }
    filtre(f) { this.filtres.push(f); return this; }
    eq(c, v) { return this.filtre((r) => String(r[c]) === String(v)); }
    neq(c, v) { return this.filtre((r) => String(r[c]) !== String(v)); }
    gt(c, v) { return this.filtre((r) => r[c] != null && r[c] > v); }
    gte(c, v) { return this.filtre((r) => r[c] != null && r[c] >= v); }
    lt(c, v) { return this.filtre((r) => r[c] != null && r[c] < v); }
    lte(c, v) { return this.filtre((r) => r[c] != null && r[c] <= v); }
    is(c, v) { return this.filtre((r) => (v === null ? r[c] == null : r[c] === v)); }
    in(c, l) { return this.filtre((r) => l.map(String).includes(String(r[c]))); }
    ilike(c, motif) {
      const re = new RegExp(`^${motif.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.')}$`, 'i');
      return this.filtre((r) => re.test(String(r[c] ?? '')));
    }
    order(c, { ascending = true } = {}) { this.ordres.push([c, ascending]); return this; }
    limit(n) { this.max = n; return this; }
    single() { this.un = true; return this; }
    maybeSingle() { this.un = true; this.peutEtreVide = true; return this; }
    then(ok, ko) { return this.executer().then(ok, ko); }

    lignesVisibles() {
      if (VUES[this.table]) return VUES[this.table]();
      return DB[this.table].filter((r) => (LECTURE[this.table] || (() => false))(r));
    }
    async executer() {
      await new Promise((r) => setTimeout(r, 60));
      try {
        let data;
        if (this.op === 'select') data = this.lire();
        else if (this.op === 'insert') data = this.inserer();
        else if (this.op === 'update') data = this.modifier();
        else data = this.supprimer();
        if (this.op !== 'select') sauver();
        if (this.compte && this.tete) return { data: null, count: data.length, error: null };
        if (this.op !== 'select' && !this.retour) return { data: null, error: null };
        let res = data.map((r) => projeter(this.table, r, analyserSelect(this.sel)));
        if (this.un) {
          if (res.length > 1 || (!res.length && !this.peutEtreVide)) return { data: null, error: { message: 'JSON object requested, multiple (or no) rows returned', code: 'PGRST116' } };
          res = res[0] ?? null;
        }
        return { data: copie(res), error: null };
      } catch (e) {
        return { data: null, error: e && e.message ? e : { message: String(e) } };
      }
    }
    lire() {
      let l = this.lignesVisibles().filter((r) => this.filtres.every((f) => f(r)));
      for (const [c, asc] of [...this.ordres].reverse()) {
        l = l.slice().sort((x, y) => {
          const a1 = x[c], b1 = y[c];
          if (a1 == null && b1 == null) return 0;
          if (a1 == null) return 1;
          if (b1 == null) return -1;
          const r = typeof a1 === 'number' && typeof b1 === 'number' ? a1 - b1 : String(a1).localeCompare(String(b1), 'fr');
          return asc ? r : -r;
        });
      }
      return this.max != null ? l.slice(0, this.max) : l;
    }
    inserer() {
      const crees = [];
      for (const v of this.valeurs) {
        const r = { ...(DEFAUTS[this.table]?.() || {}), ...(SANS_ID.includes(this.table) ? {} : { id: nouvelId() }), entreprise_id: ent(), created_at: new Date().toISOString() };
        for (const [k, val] of Object.entries(v)) if (val !== undefined) r[k] = val;
        if (this.table === 'invitations') r.entreprise_id = v.entreprise_id;
        if (r.entreprise_id !== ent() || !peut(this.table, 'insert', r)) throw erreurDroits();
        if (this.table === 'affectations' && DB.affectations.some((x) => x.projet_id === r.projet_id && x.profil_id === r.profil_id)) throw { message: 'duplicate key value', code: '23505' };
        AVANT_INSERTION[this.table]?.(r);
        DB[this.table].push(r);
        crees.push(r);
        APRES_INSERTION[this.table]?.(r);
      }
      return crees;
    }
    modifier() {
      const cibles = DB[this.table].filter((r) => (LECTURE[this.table] || (() => false))(r) && this.filtres.every((f) => f(r)));
      const faits = [];
      for (const r of cibles) {
        const avant = { ...r };
        const nouveau = { ...r, ...this.valeurs };
        if (!peut(this.table, 'update', nouveau, avant)) continue;
        AVANT_MAJ[this.table]?.(nouveau, avant);
        Object.assign(r, nouveau);
        faits.push(r);
        APRES_MAJ[this.table]?.(r, avant);
      }
      return faits;
    }
    supprimer() {
      const cibles = DB[this.table].filter((r) => (LECTURE[this.table] || (() => false))(r) && this.filtres.every((f) => f(r)) && peut(this.table, 'delete', r));
      for (const r of cibles) {
        DB[this.table] = DB[this.table].filter((x) => x !== r);
        if (this.table === 'projets') {
          for (const t of ['lots', 'taches', 'rapports', 'commandes', 'factures', 'affectations', 'activites']) DB[t] = DB[t].filter((x) => x.projet_id !== r.id);
          DB.mouvements_stock.forEach((m) => { if (m.projet_id === r.id) m.projet_id = null; });
        }
        if (this.table === 'lots') for (const t of ['taches', 'rapports', 'commandes', 'factures']) DB[t].forEach((x) => { if (x.lot_id === r.id) x.lot_id = null; });
        if (this.table === 'rapports') DB.rapport_photos = DB.rapport_photos.filter((x) => x.rapport_id !== r.id);
        if (this.table === 'articles') DB.mouvements_stock = DB.mouvements_stock.filter((x) => x.article_id !== r.id);
      }
      return cibles;
    }
  }

  // ───────────────────────── Fonctions serveur simulées ─────────────────────────

  const RPC = {
    receptionner_commande({ p_commande }) {
      if (!a('direction', 'achats', 'magasinier')) throw { message: 'Action non autorisée' };
      const c = DB.commandes.find((x) => x.id === p_commande && x.statut === 'commandee');
      if (!c) throw { message: 'Commande introuvable ou déjà traitée' };
      const avant = { ...c };
      c.statut = 'livree';
      APRES_MAJ.commandes(c, avant);
      return null;
    },
    accepter_invitation() { return !!profil(); },
    reinitialiser_demo() {
      DB = graine();
      PHOTOS = {};
      sauverPhotos();
      return null;
    },
    charger_demo() { throw { message: 'La démonstration est déjà chargée.' }; },
  };

  const INSTRUCTIONS_IA = `Tu es KOORDIN IA, l'assistant de pilotage intégré à la plateforme KOORDIN, utilisée par des entreprises du BTP pour coordonner leurs chantiers.
Les données ci-dessous sont celles de l'entreprise (une entreprise de démonstration), limitées à ce que la personne connectée a le droit de voir.
Réponds en français, de façon directe et concrète, comme un conducteur de travaux expérimenté qui parle à un décideur. Appuie-toi uniquement sur ces données : cite les chiffres, les projets et les dates ; si une information manque, dis-le au lieu d'inventer. Termine par une ou plusieurs actions concrètes, avec le service concerné. Formate les montants avec des espaces (ex. 1 250 000 FCFA). Reste bref (environ 200 mots) sauf si on te demande un rapport, un courrier ou une analyse détaillée. Pas de tableaux Markdown : des listes simples.`;

  function contexteIA() {
    const nomP = (id) => nomProjet(id) || id;
    const sans = (r, ...cles) => { const o = { ...r }; for (const k of ['id', 'entreprise_id', 'created_at', 'created_by', ...cles]) delete o[k]; return o; };
    const avecProjet = (l) => l.map((r) => ({ projet: nomP(r.projet_id), ...sans(r, 'projet_id') }));
    const lisible = (t) => DB[t].filter((r) => LECTURE[t](r));
    const nomLot = (id) => DB.lots.find((l) => l.id === id)?.nom || null;
    const nomFrs = (id) => DB.fournisseurs.find((f) => f.id === id)?.nom || null;
    const depuis = jour(-30);
    return {
      date_du_jour: jour(),
      entreprise: DB.entreprises[0].nom,
      devise: DB.entreprises[0].devise,
      utilisateur: { nom: profil().nom, role: role() },
      projets: vProjets().map((p) => sans(p, 'updated_at', 'description', 'date_fin_reelle')),
      lots: avecProjet(vBudgetLots().map((l) => sans(l, 'ordre'))),
      planning: avecProjet(lisible('taches').map((t) => ({ ...sans(t, 'responsable_id', 'lot_id'), lot: nomLot(t.lot_id) }))),
      rapports_30_derniers_jours: avecProjet(lisible('rapports').filter((r) => r.date_rapport >= depuis)
        .map((r) => ({ ...sans(r, 'auteur_id', 'valide_par', 'valide_at', 'lot_id'), auteur: nomDe(r.auteur_id), lot: nomLot(r.lot_id) }))),
      commandes: avecProjet(lisible('commandes').map((c) => ({ ...sans(c, 'lot_id', 'fournisseur_id'), lot: nomLot(c.lot_id), fournisseur: nomFrs(c.fournisseur_id) }))),
      factures: avecProjet(lisible('factures').map((f) => ({ ...sans(f, 'lot_id', 'fournisseur_id', 'commande_id'), lot: nomLot(f.lot_id), fournisseur: nomFrs(f.fournisseur_id) }))),
      stock: vStock().map((s) => sans(s)),
      alertes_recentes: lisible('activites').filter((x) => x.type === 'alerte').slice(-25).map((x) => ({ niveau: x.niveau, message: x.message, date: x.created_at.slice(0, 10) })),
    };
  }

  const erreurFonction = (msg) => ({ message: msg, context: { json: async () => ({ erreur: msg }) } });
  const MESSAGES_IA = {
    not_granted: 'Vous n’avez pas autorisé cette page à utiliser Claude. Rouvrez la démonstration et acceptez la demande pour utiliser l’assistant.',
    sampling_disabled: 'Claude n’est pas disponible pour ce compte.',
    rate_limited: 'Trop de questions d’affilée, ou limite d’utilisation atteinte. Réessayez dans quelques minutes.',
    session_expired: 'Votre session Claude a expiré : reconnectez-vous puis réessayez.',
    refused: 'Claude a refusé cette demande. Reformulez votre question sur vos chantiers.',
  };

  async function assistantIA(messages) {
    if (!a('direction', 'coordinateur', 'achats', 'comptable', 'magasinier')) return { data: null, error: erreurFonction('L’assistant IA n’est pas activé pour votre rôle') };
    let sample = null;
    try { sample = await window.claude?.use?.('sample'); } catch { sample = null; }
    if (!sample) return { data: null, error: erreurFonction('L’assistant IA de la démonstration fonctionne quand la page est ouverte dans Claude (application ou claude.ai).') };
    const tours = [{ role: 'user', content: `${INSTRUCTIONS_IA}\n\nDonnées de l'entreprise (JSON) :\n${JSON.stringify(contexteIA())}` }, ...messages.slice(-12)];
    try {
      const { text } = await sample(tours, { cache: false });
      return { data: { reponse: text }, error: null };
    } catch (e) {
      return { data: null, error: erreurFonction(MESSAGES_IA[e?.code] || 'L’assistant IA est momentanément indisponible. Réessayez.') };
    }
  }

  // ───────────────────────── Client ─────────────────────────

  const session = () => {
    const p = DB.profils.find((x) => x.id === moi);
    return p ? { user: { id: p.id, email: p.email }, access_token: 'demo' } : null;
  };
  const indisponible = async () => ({ data: {}, error: { message: 'Non disponible dans la démonstration.' } });

  const client = {
    from: (table) => new Requete(table),
    rpc: async (nom, args = {}) => {
      await new Promise((r) => setTimeout(r, 60));
      try {
        const data = RPC[nom](args);
        sauver();
        return { data, error: null };
      } catch (e) {
        return { data: null, error: e && e.message ? e : { message: String(e) } };
      }
    },
    auth: {
      getSession: async () => ({ data: { session: profil() ? session() : null }, error: null }),
      signInWithPassword: async ({ email }) => {
        const p = DB.profils.find((x) => x.email === email && x.actif);
        if (!p) return { data: {}, error: { message: 'Invalid login credentials' } };
        moi = p.id;
        ecrire(CLE_MOI, moi);
        return { data: { session: session() }, error: null };
      },
      signOut: async () => {
        moi = null;
        try { localStorage.removeItem(CLE_MOI); } catch { /* rien */ }
        auditeursAuth.forEach((f) => f('SIGNED_OUT', null));
        return { error: null };
      },
      onAuthStateChange: (f) => { auditeursAuth.push(f); return { data: { subscription: { unsubscribe() {} } } }; },
      signUp: indisponible, resetPasswordForEmail: indisponible, updateUser: indisponible,
    },
    storage: {
      from: () => ({
        upload: async (chemin, blob) => {
          const url = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(blob); });
          PHOTOS[chemin] = url;
          if (!ecrire(CLE_PHOTOS, JSON.stringify(PHOTOS))) { /* trop de photos pour le stockage local : gardées le temps de la visite */ }
          return { data: { path: chemin }, error: null };
        },
        createSignedUrls: async (chemins) => ({ data: chemins.map((c) => ({ path: c, signedUrl: PHOTOS[c] || null })), error: null }),
      }),
    },
    functions: {
      invoke: async (nom, { body } = {}) => (nom === 'koordin-ia' ? assistantIA(body?.messages || []) : { data: null, error: erreurFonction('Fonction inconnue') }),
    },
    channel: () => {
      const abonnements = [];
      const canal = {
        on(_evt, filtre, cb) { const e = { table: filtre.table, cb }; ecouteurs.push(e); abonnements.push(e); return canal; },
        subscribe() { return canal; },
        unsubscribe() { for (const e of abonnements) { const i = ecouteurs.indexOf(e); if (i >= 0) ecouteurs.splice(i, 1); } },
      };
      return canal;
    },
  };

  charger();
  return {
    client: () => client,
    personnes: () => DB.profils.filter((p) => p.actif).map((p) => ({ ...p })),
  };
})();

</script>

// ─────────────────────────────── État ───────────────────────────────

const S = {

// ─────────────────────────────── Utilitaires ───────────────────────────────

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const role = () => S.profil?.role;
const can = (...roles) => roles.includes(role());
const num = (v) => Number(v) || 0;
const nf = new Intl.NumberFormat('fr-FR');
const devise = () => S.entreprise?.devise || 'FCFA';
const money = (v) => `${nf.format(Math.round(num(v)))} ${devise()}`;
function moneyShort(v) {
  const n = num(v), a = Math.abs(n);
  if (a >= 1e9) return `${(n / 1e9).toLocaleString('fr-FR', { maximumFractionDigits: 2 })} Md ${devise()}`;
  if (a >= 1e6) return `${(n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} M ${devise()}`;
  return money(n);
}
const pct = (a, b) => (num(b) > 0 ? Math.round((num(a) / num(b)) * 100) : 0);
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const parseDay = (s) => new Date(`${String(s).slice(0, 10)}T00:00:00`);
const fdate = (d) => (d ? parseDay(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—');
function ago(ts) {
  const s = Math.round((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return 'à l’instant';
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  if (s < 7 * 86400) return `il y a ${Math.floor(s / 86400)} j`;
  return new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
}
const initiales = (nom) => String(nom || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
const badge = ([cls, txt]) => `<span class="badge ${cls}">${esc(txt)}</span>`;
const nomMembre = (id) => S.equipe.find((p) => p.id === id)?.nom || '—';
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

async function q(promesse) {
  const { data, error } = await promesse;
  if (error) throw error;
  return data;
}

function messageErreur(e) {
  const m = String(e?.message || e || '');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion internet. Vérifiez le réseau puis réessayez.';
  if (/row-level security|permission denied|42501/i.test(m)) return 'Vous n’avez pas l’autorisation pour cette action.';
  if (/factures_numero_unique|duplicate key/i.test(m)) return 'Ce numéro existe déjà pour ce fournisseur (doublon possible).';
  if (/Invalid login credentials/i.test(m)) return 'Email ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return 'Confirmez d’abord votre adresse email (lien reçu par mail).';
  if (/User already registered/i.test(m)) return 'Un compte existe déjà avec cet email. Connectez-vous.';
  if (/Password should be/i.test(m)) return 'Le mot de passe doit contenir au moins 6 caractères.';
  if (/rate limit/i.test(m)) return 'Trop de tentatives. Patientez quelques minutes.';
  return m || 'Une erreur est survenue.';
}

function toast(msg, type = 'ok', duree = 4200) {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), duree);
}

const empty = (ico, txt) => `<div class="empty"><div class="big">${ico}</div>${esc(txt)}</div>`;
const loading = () => '<div class="loading"><div class="spinner"></div></div>';

function progressBar(valeur, { attendu = null, cls = '', label = null } = {}) {
  const v = Math.max(0, Math.min(100, num(valeur)));
  const mark = attendu != null ? `<i class="mark" style="left:${Math.max(0, Math.min(100, attendu))}%" title="Prévu : ${attendu} %"></i>` : '';
  return `<div class="progress-row"><div class="progress ${cls}"><span style="width:${v}%"></span>${mark}</div><span class="pct">${label ?? v} %</span></div>`;
}
function consoCls(consomme, budget) {
  const p = pct(consomme, budget);
  return p > 100 ? 'crit' : p > 90 ? 'warn' : 'ok';
}

// Champs de formulaire
const F = {
  text(name, label, value = '', o = {}) {
    return `<label class="field ${o.full ? 'full' : ''}">${esc(label)}${o.required ? ' *' : ''}
      <input name="${name}" type="${o.type || 'text'}" value="${esc(value ?? '')}" ${o.required ? 'required' : ''}
        ${o.min != null ? `min="${o.min}"` : ''} ${o.max != null ? `max="${o.max}"` : ''} ${o.step ? `step="${o.step}"` : ''}
        ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''} ${o.inputmode ? `inputmode="${o.inputmode}"` : ''} ${o.autocomplete ? `autocomplete="${o.autocomplete}"` : ''}>
      ${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}</label>`;
  },
  area(name, label, value = '', o = {}) {
    return `<label class="field full">${esc(label)}${o.required ? ' *' : ''}
      <textarea name="${name}" ${o.required ? 'required' : ''} ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''}>${esc(value ?? '')}</textarea>
      ${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}</label>`;
  },
  select(name, label, options, value = '', o = {}) {
    const opts = options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('');
    return `<label class="field ${o.full ? 'full' : ''}">${esc(label)}${o.required ? ' *' : ''}
      <select name="${name}" ${o.required ? 'required' : ''}>${o.vide !== undefined ? `<option value="">${esc(o.vide)}</option>` : ''}${opts}</select>
      ${o.hint ? `<span class="hint">${esc(o.hint)}</span>` : ''}</label>`;
  },
};

function lireFormulaire(form) {
  const o = {};
  for (const [k, v] of new FormData(form).entries()) {
    if (v instanceof File) continue;
    const t = String(v).trim();
    o[k] = t === '' ? null : t;
  }
  return o;
}

// Fenêtre modale générique
function ouvrirModale({ titre, corps, large = false, onSubmit = null, boutonOk = 'Enregistrer', onOpen = null }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const contenu = onSubmit
    ? `<form id="mform" novalidate>${corps}<div class="form-actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn primary" type="submit">${esc(boutonOk)}</button></div></form>`
    : corps;
  ov.innerHTML = `<div class="modal ${large ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${esc(titre)}</h3><button class="close" data-close aria-label="Fermer">×</button></div>
    <div class="modal-body">${contenu}</div></div>`;
  const fermer = () => { ov.remove(); document.removeEventListener('keydown', echap); };
  const echap = (e) => { if (e.key === 'Escape') fermer(); };
  document.addEventListener('keydown', echap);
  ov.addEventListener('click', (e) => { if (e.target === ov || e.target.closest('[data-close]')) fermer(); });
  if (onSubmit) {
    const form = $('#mform', ov);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!form.reportValidity()) return;
      const btn = $('button[type="submit"]', form);
      btn.disabled = true;
      try {
        const res = await onSubmit(lireFormulaire(form), form);
        if (res !== false) fermer();
      } catch (err) {
        console.error(err);
        toast(messageErreur(err), 'err', 6000);
      } finally {
        btn.disabled = false;
      }
    });
  }
  document.body.appendChild(ov);
  onOpen?.(ov);
  $('input, select, textarea', ov)?.focus();
  return { el: ov, fermer };
}

function confirmer(message, libelle = 'Confirmer') {
  return new Promise((resolve) => {
    const m = ouvrirModale({
      titre: 'Confirmation',
      corps: `<p>${esc(message)}</p><div class="form-actions"><button class="btn ghost" data-close>Annuler</button><button class="btn danger" id="ok-confirm">${esc(libelle)}</button></div>`,
    });
    $('#ok-confirm', m.el).onclick = () => { m.fermer(); resolve(true); };
    m.el.addEventListener('click', (e) => { if (e.target.closest('[data-close]') || e.target === m.el) resolve(false); });
  });
}

function graphiqueBarres(canvas, { labels, series, horizontal = false, format = (v) => v, max }) {

        borderSkipped: 'start',
        barPercentage: 0.86,
        categoryPercentage: 0.72,
      })),
    },
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: cssVar('--surface-3'),
          titleColor: cssVar('--text'),
          bodyColor: cssVar('--text'),
          borderColor: cssVar('--border-2'),
          borderWidth: 1,
          padding: 10,
          callbacks: { label: (ctx) => ` ${ctx.dataset.label} : ${format(ctx.raw)}` },
        },
      },
      scales: {
        [horizontal ? 'x' : 'y']: {
          beginAtZero: true, max,
          grid: { color: grille }, border: { display: false },
          ticks: { color: texte, font: { family: 'Sora', size: 11 }, callback: (v) => format(v) },
        },
        [horizontal ? 'y' : 'x']: {
          grid: { display: false }, border: { color: grille },
          ticks: { color: texte, font: { family: 'Sora', size: 11 }, autoSkip: false, callback(v) { const l = this.getLabelForValue(v); const n = this.chart.width < 480 ? 13 : 22; return l.length > n ? `${l.slice(0, n - 1)}…` : l; } },
        },
      },
    },
  });
  S.charts.push(chart);
  return chart;
}

const legende = (items) => `<div class="legend">${items.map(([lbl, v]) => `<span><i style="background:var(${v})"></i>${esc(lbl)}</span>`).join('')}</div>`;

// ─────────────────────────────── Démarrage ───────────────────────────────

function appliquerTheme() {
  let t = null;
  try { t = localStorage.getItem('koordin-theme'); } catch { /* stockage indisponible */ }
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else if (t === 'auto') delete document.documentElement.dataset.theme;
}

async function demarrer() {
  appliquerTheme();
  if (DEMO) {
    sb = window.koordinDemo.client();
    sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT') { S.profil = null; ecranConnexion(); } });
    const { data: { session } } = await sb.auth.getSession();
    return session ? ouvrirApplication(session) : ecranConnexion();
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installPrompt = e; });

  if (!CFG.SUPABASE_URL || /VOTRE-PROJET/.test(CFG.SUPABASE_URL) || !CFG.SUPABASE_ANON_KEY || /VOTRE-CLE/.test(CFG.SUPABASE_ANON_KEY)) {
    return ecranConfiguration();
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  sb.auth.onAuthStateChange((evt) => {
    if (evt === 'PASSWORD_RECOVERY') setTimeout(ecranNouveauMotDePasse, 0);
    if (evt === 'SIGNED_OUT') { S.profil = null; ecranConnexion(); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (!session) return ecranConnexion();
  await ouvrirApplication(session);
}

function ecranConnexion(onglet = 'connexion', message = null) {
  if (DEMO) return ecranDemo();
  const onglets = { connexion: 'Se connecter', creer: 'Créer mon entreprise', invite: 'J’ai une invitation' };
  const formulaires = {
    connexion: `
      ${F.text('email', 'Email', '', { type: 'email', required: true, autocomplete: 'email' })}
      ${F.text('password', 'Mot de passe', '', { type: 'password', required: true, autocomplete: 'current-password' })}
      <button class="btn primary block" type="submit">Se connecter</button>
      <button class="auth-link" type="button" data-oubli>Mot de passe oublié ?</button>`,
    creer: `
      ${F.text('entreprise', 'Nom de votre entreprise', '', { required: true, placeholder: 'Ex. BTP Ivoire Construction' })}
      ${F.text('nom', 'Votre nom complet', '', { required: true, autocomplete: 'name' })}
      ${F.text('email', 'Email professionnel', '', { type: 'email', required: true, autocomplete: 'email' })}
      ${F.text('password', 'Mot de passe (8 caractères minimum)', '', { type: 'password', required: true, autocomplete: 'new-password' })}
      <button class="btn primary block" type="submit">Créer mon espace KOORDIN</button>
      <p class="muted" style="font-size:12px">Vous serez l’administrateur (rôle Direction) et pourrez inviter votre équipe.</p>`,
    invite: `
      <p class="muted" style="font-size:12px">Utilisez <b>exactement</b> l’adresse email à laquelle votre direction vous a invité.</p>
      ${F.text('nom', 'Votre nom complet', '', { required: true, autocomplete: 'name' })}
      ${F.text('email', 'Email (celui de l’invitation)', '', { type: 'email', required: true, autocomplete: 'email' })}
      ${F.text('password', 'Choisissez un mot de passe (8 caractères minimum)', '', { type: 'password', required: true, autocomplete: 'new-password' })}
      <button class="btn primary block" type="submit">Rejoindre mon équipe</button>`,
  };
  $('#root').innerHTML = `<div class="auth-wrap"><div class="auth-card">
    <div class="brand"><div class="hex"></div><div class="brand-name">KOORDIN</div></div>
    <p class="auth-sub">Tous vos chantiers, une seule plateforme.</p>
    <div class="auth-tabs">${Object.entries(onglets).map(([k, l]) => `<button type="button" data-tab="${k}" class="${k === onglet ? 'active' : ''}">${l}</button>`).join('')}</div>
    ${message ? `<div class="auth-msg ${message.type}" style="margin-bottom:14px">${esc(message.texte)}</div>` : ''}
    <form class="auth-form" id="auth-form" novalidate>${formulaires[onglet]}</form>
  </div></div>`;

  $$('[data-tab]').forEach((b) => (b.onclick = () => ecranConnexion(b.dataset.tab)));
  $('[data-oubli]')?.addEventListener('click', ecranMotDePasseOublie);
  const form = $('#auth-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const v = lireFormulaire(form);
    const btn = $('button[type="submit"]', form);
    btn.disabled = true;
    try {
      if (onglet === 'connexion') {
        const { data, error } = await sb.auth.signInWithPassword({ email: v.email, password: v.password });
        if (error) throw error;
        await ouvrirApplication(data.session);
        return;
      }
      if (v.password.length < 8) throw new Error('Le mot de passe doit contenir au moins 8 caractères.');
      const meta = onglet === 'creer' ? { nom: v.nom, entreprise: v.entreprise } : { nom: v.nom };
      const { data, error } = await sb.auth.signUp({
        email: v.email, password: v.password,
        options: { data: meta, emailRedirectTo: location.origin + location.pathname },

      if (error) throw error;
      if (data.session) {
        await ouvrirApplication(data.session);
      } else {
        ecranConnexion('connexion', { type: 'ok', texte: `Compte créé. Un email de confirmation a été envoyé à ${v.email} : cliquez sur le lien, puis connectez-vous ici.` });
      }

      ecranConnexion(onglet, { type: 'err', texte: messageErreur(err) });
    } finally {
      btn.disabled = false;
    }
  });
}

function ecranNouveauMotDePasse() {

    </form></div></div>`;
  $('#f').onsubmit = async (e) => {

async function ouvrirApplication(session) {
  S.session = session;
  $('#root').innerHTML = loading();
  try {
    let profil = await q(sb.from('profils').select('*, entreprises(*)').eq('id', session.user.id).maybeSingle());
    if (!profil) {
      const rejoint = await q(sb.rpc('accepter_invitation'));
      if (rejoint) profil = await q(sb.from('profils').select('*, entreprises(*)').eq('id', session.user.id).maybeSingle());
    }
    if (!profil) return ecranSansEntreprise(session.user.email);
    S.profil = profil;
    S.entreprise = profil.entreprises;
    await chargerEquipe();
    construireInterface();
    ecouterTempsReel();
    if (!DEMO) window.onhashchange = naviguer;
    await naviguer();
  } catch (e) {
    console.error(e);
    $('#root').innerHTML = `<div class="auth-wrap"><div class="auth-card"><div class="brand"><div class="hex"></div><div class="brand-name">KOORDIN</div></div>
      <div class="auth-msg err" style="margin:16px 0">${esc(messageErreur(e))}</div>
      <button class="btn primary block" onclick="location.reload()">Réessayer</button></div></div>`;
  }
}

// ─── Notifications temps réel ───

function cleVu() { return `koordin-vu-${S.profil?.id}`; }
function dernierVu() {
  try { return localStorage.getItem(cleVu()) || '1970-01-01T00:00:00Z'; } catch { return '1970-01-01T00:00:00Z'; }
}
async function majCompteurNotifications() {
  const { count } = await sb.from('activites').select('id', { count: 'exact', head: true }).gt('created_at', dernierVu());
  S.nonLues = count || 0;
  const el = $('#notif-count');
  if (!el) return;
  el.textContent = S.nonLues > 99 ? '99+' : S.nonLues;
  el.classList.toggle('hidden', !S.nonLues);
}

function ecouterTempsReel() {
  S.canal?.unsubscribe();
  S.canal = sb.channel('koordin-activites')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'activites' }, (payload) => {
      const a = payload.new;
      if (a.type === 'equipe') chargerEquipe();
      if (a.acteur_id !== S.profil.id && a.niveau !== 'info') toast(a.message, a.niveau === 'critique' ? 'err' : 'warn', 7000);
      else if (a.acteur_id !== S.profil.id && a.type === 'rapport') toast(a.message, 'ok');
      majCompteurNotifications();
    })
    .subscribe();
}

}

async function ouvrirNotifications(e) {

const PAGES = {};

async function naviguer() {
  if (!S.profil) return;
  const h = hashCourant().startsWith('#/') ? hashCourant().slice(2) : 'dashboard';
  const [page, id] = h.split('/');
  const autorise = page === 'projet' || (page === 'nouveau-rapport' && can(...ROLES_RAPPORT)) || menuVisible().some((m) => m.r === page);
  const cible = PAGES[page] && autorise ? page : 'dashboard';
  $$('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === (cible === 'projet' ? 'projets' : cible)));
  fermerPanneaux();
  detruireGraphiques();
  const main = $('#main');
  main.innerHTML = loading();
  main.scrollTop = 0;
  try {
    await PAGES[cible](id);
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="page"><div class="card">${empty('⚠️', messageErreur(e))}<div class="right"><button class="btn" onclick="location.reload()">Recharger</button></div></div></div>`;

function page(html) {
  $('#main').innerHTML = `<div class="page">${html}</div>`;

const entete = (titre, sousTitre = '', actions = '') => `<div class="page-head"><div><h1 class="page-title">${titre}</h1>${sousTitre ? `<p class="page-sub">${sousTitre}</p>` : ''}</div><div class="page-actions">${actions}</div></div>`;

async function dashDirection() {
  const [projets, activites, stock] = await Promise.all([
    q(sb.from('v_projets').select('*').order('nom')),
    q(sb.from('activites').select('*').order('created_at', { ascending: false }).limit(12)),
    q(sb.from('v_stock').select('id, alerte')),
  ]);
  const actifs = projets.filter((p) => p.statut !== 'termine');
  const critiques = actifs.filter((p) => p.sante === 'critique').length;
  const budget = actifs.reduce((s, p) => s + num(p.budget), 0);
  const engage = actifs.reduce((s, p) => s + Math.max(num(p.engage), num(p.facture)), 0);
  const avMoyen = actifs.length ? Math.round(actifs.reduce((s, p) => s + p.avancement, 0) / actifs.length) : 0;
  const avPrevu = actifs.filter((p) => p.avancement_attendu != null);
  const prevuMoyen = avPrevu.length ? Math.round(avPrevu.reduce((s, p) => s + p.avancement_attendu, 0) / avPrevu.length) : null;
  const attente = projets.reduce((s, p) => s + p.rapports_en_attente, 0);
  const alertesStock = stock.filter((a) => a.alerte).length;

  page(`
    ${entete(bonjour(), `Vue d’ensemble de ${esc(S.entreprise.nom)} — ${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}`,
      can('direction', 'coordinateur') ? '<a class="btn primary" href="#/projets" data-nouveau-projet>＋ Nouveau projet</a>' : '')}
    ${!projets.length && can('direction') ? `<div class="notice">Bienvenue ! Créez votre premier projet, ou chargez des <b>données de démonstration</b> depuis <a href="#/parametres">Paramètres</a> pour découvrir KOORDIN.</div>` : ''}

function formulaireProjet(projet = null) {
  const v = projet || { statut: 'en_cours', date_debut: todayISO() };
  ouvrirModale({
    titre: projet ? 'Modifier le projet' : 'Nouveau projet',
    large: true,
    corps: `<div class="form-grid">
      ${F.text('nom', 'Nom du projet', v.nom, { required: true, full: true, placeholder: 'Ex. Résidence Les Palmiers' })}
      ${F.text('reference', 'Référence', v.reference)}
      ${F.text('client', 'Client / maître d’ouvrage', v.client)}
      ${F.text('localisation', 'Localisation', v.localisation)}
      ${F.text('budget', `Budget total (${devise()})`, v.budget, { type: 'number', min: 0, step: '1', required: true, inputmode: 'numeric' })}
      ${F.text('date_debut', 'Date de début', v.date_debut, { type: 'date', required: true })}
      ${F.text('date_fin_prevue', 'Date de fin prévue', v.date_fin_prevue, { type: 'date', required: true })}
      ${F.select('statut', 'Statut', Object.entries(STATUT_PROJET).map(([k, [, l]]) => [k, l]), v.statut)}
      ${F.area('description', 'Description / spécificités du projet', v.description)}
      ${!projet ? `<label class="field full" style="flex-direction:row;align-items:center;gap:8px;font-weight:500"><input type="checkbox" name="lots_standard" checked style="width:auto"> Créer les lots standard (Gros œuvre, Électricité, Plomberie, Menuiserie, Finitions) — modifiables ensuite</label>` : ''}
    </div>`,
    onSubmit: async (d) => {
      if (d.date_fin_prevue < d.date_debut) throw new Error('La date de fin doit être après la date de début.');
      const data = {
        nom: d.nom, reference: d.reference, client: d.client, localisation: d.localisation,
        budget: num(d.budget), date_debut: d.date_debut, date_fin_prevue: d.date_fin_prevue,
        statut: d.statut, description: d.description,
        date_fin_reelle: d.statut === 'termine' ? (projet?.date_fin_reelle || todayISO()) : null,
      };
      if (projet) {
        await q(sb.from('projets').update(data).eq('id', projet.id));
        toast('Projet mis à jour.');
        naviguer();
      } else {
        const cree = await q(sb.from('projets').insert(data).select('id').single());
        if (d.lots_standard) {
          const parts = [['Gros œuvre', 0.45], ['Électricité', 0.15], ['Plomberie', 0.12], ['Menuiserie', 0.1], ['Finitions', 0.18]];
          await q(sb.from('lots').insert(parts.map(([nom, k], i) => ({ projet_id: cree.id, nom, budget: Math.round(num(d.budget) * k), ordre: i + 1 }))));
        }
        toast('Projet créé.');
        allerA(`#/projet/${cree.id}`);
      }
    },
  });
}

let ongletProjet = 'apercu';

PAGES.projet = async (id) => {
  const projet = await q(sb.from('v_projets').select('*').eq('id', id).maybeSingle());
  if (!projet) {
    page(`<div class="card">${empty('🔒', 'Projet introuvable ou non accessible.')}</div>`);
    return;
  }
  const tech = role() === 'technicien';
  const onglets = [
    ['apercu', 'Aperçu'], ['lots', tech ? 'Lots' : 'Lots et budget'], ['planning', 'Planning'],
    ...(can(...ROLES_RAPPORT) ? [['rapports', 'Rapports']] : []),
    ['equipe', 'Équipe'],
    ...(can('direction', 'coordinateur', 'achats', 'comptable', 'magasinier') ? [['achats', 'Achats et factures']] : []),
  ];
  if (!onglets.some(([k]) => k === ongletProjet)) ongletProjet = 'apercu';
  const p = page(`
    <a class="back" href="#/projets">← ${tech ? 'Mes chantiers' : 'Projets'}</a>
    ${entete(esc(projet.nom), `${badge(SANTE[projet.sante])} ${badge(STATUT_PROJET[projet.statut])} <span class="muted">${esc([projet.reference, projet.client, projet.localisation].filter(Boolean).join(' · '))}</span>`,
      `${can(...ROLES_RAPPORT) && projet.statut !== 'termine' ? `<a class="btn" href="#/nouveau-rapport" data-projet-rapport="${projet.id}">➕ Rapport</a>` : ''}
       ${can('direction', 'coordinateur') ? '<button class="btn" id="edit-p">✏️ Modifier</button>' : ''}
       ${can('direction') ? '<button class="btn danger" id="del-p">Supprimer</button>' : ''}`)}
    <div class="tabs">${onglets.map(([k, l]) => `<button class="tab ${k === ongletProjet ? 'active' : ''}" data-onglet="${k}">${l}</button>`).join('')}</div>
    <div id="onglet"></div>`);

  $('#edit-p', p)?.addEventListener('click', () => formulaireProjet(projet));
  $('#del-p', p)?.addEventListener('click', async () => {
    if (!(await confirmer(`Supprimer définitivement « ${projet.nom} » et toutes ses données (lots, rapports, commandes, factures) ?`, 'Supprimer'))) return;
    try {
      await q(sb.from('projets').delete().eq('id', projet.id));
      toast('Projet supprimé.');
      allerA('#/projets');
    } catch (e) { toast(messageErreur(e), 'err'); }
  });
  $$('[data-onglet]', p).forEach((b) => (b.onclick = () => {
    ongletProjet = b.dataset.onglet;
    $$('[data-onglet]', p).forEach((x) => x.classList.toggle('active', x === b));
    rendreOngletProjet(projet);
  }));
  await rendreOngletProjet(projet);
};

async function rendreOngletProjet(projet) {
  const zone = $('#onglet');
  zone.innerHTML = loading();
  detruireGraphiques();
  const ONGLETS = { apercu: ongletApercu, lots: ongletLots, planning: ongletPlanning, rapports: ongletRapports, equipe: ongletEquipe, achats: ongletAchatsProjet };
  try {
    await ONGLETS[ongletProjet](projet, zone);
  } catch (e) {
    console.error(e);
    zone.innerHTML = `<div class="card">${empty('⚠️', messageErreur(e))}</div>`;
  }
}

async function ongletApercu(projet, zone) {
  const tech = role() === 'technicien';
  const activites = await q(sb.from('activites').select('*').eq('projet_id', projet.id).order('created_at', { ascending: false }).limit(10));
  const consomme = Math.max(num(projet.engage), num(projet.facture));
  const ecart = projet.avancement_attendu != null ? projet.avancement - projet.avancement_attendu : null;
  zone.innerHTML = `
    <div class="grid k4">
      ${kpi('Avancement', `${projet.avancement} %`, ecart != null ? `Prévu : ${projet.avancement_attendu} % (${ecart >= 0 ? '+' : ''}${ecart} pts)` : '', ecart != null && ecart < -15 ? 'alert' : ecart != null && ecart < -5 ? 'warn' : '')}
      ${tech ? kpi('Début', fdate(projet.date_debut)) : kpi('Budget', moneyShort(projet.budget), `Engagé : ${moneyShort(projet.engage)}`)}
      ${tech ? kpi('Rapports à valider', projet.rapports_en_attente) : kpi('Consommé', `${pct(consomme, projet.budget)} %`, `Facturé : ${moneyShort(projet.facture)} · Payé : ${moneyShort(projet.paye)}`, pct(consomme, projet.budget) > 100 ? 'alert' : pct(consomme, projet.budget) > 90 ? 'warn' : '')}
      ${kpi('Fin prévue', fdate(projet.date_fin_prevue), projet.jours_de_retard > 0 ? `<span style="color:var(--crit)">⏱ ${projet.jours_de_retard} jours de retard</span>` : projet.date_fin_reelle ? `Terminé le ${fdate(projet.date_fin_reelle)}` : `Dernier rapport : ${fdate(projet.dernier_rapport)}`, projet.jours_de_retard > 0 ? 'alert' : '')}
    </div>
    <div class="grid c21 section">
